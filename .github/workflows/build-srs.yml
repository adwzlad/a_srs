name: Build SRS Rule Sets

on:
  push:
    branches:
      - main
  workflow_dispatch:
#  schedule:
#    - cron: "0 */6 * * *"

permissions:
  contents: write

concurrency:
  group: build-srs-main
  cancel-in-progress: false


jobs:

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:

      - name: Checkout
        uses: actions/checkout@v5


      - name: Run unit tests
        run: |
          python3 tests/test_build_srs.py



  build:

    needs: test

    runs-on: ubuntu-latest
    timeout-minutes: 60


    steps:


      - name: Checkout
        uses: actions/checkout@v5



      - name: Install sing-box stable
        run: |
          curl -fsSL https://sing-box.app/install.sh | sudo sh
          sing-box version



      - name: Install jq
        run: |
          sudo apt-get update
          sudo apt-get install -y jq



      - name: Build SRS
        run: |
          python3 .github/scripts/build_srs.py



      - name: Verify SRS equals JSON
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Verify JSON -> SRS -> JSON"
          echo "========================================"


          if [ ! -f generated_srs.txt ]; then
              echo "ERROR: generated_srs.txt missing"
              exit 1
          fi


          mkdir -p verify


          while IFS= read -r srs_file
          do

              name=$(basename "$srs_file" .srs)

              json_file="${name}.json"


              echo ""
              echo "[CHECK] ${name}"


              if [ ! -f "${json_file}" ]; then
                  echo "ERROR: Missing ${json_file}"
                  exit 1
              fi


              sing-box rule-set decompile \
                --output "verify/${name}.json" \
                "${srs_file}"


              jq -S . "${json_file}" \
                > "verify/${name}.source.json"


              jq -S . "verify/${name}.json" \
                > "verify/${name}.decoded.json"



              diff -u \
                "verify/${name}.source.json" \
                "verify/${name}.decoded.json"



              echo "✓ ${name}.srs OK"


          done < generated_srs.txt


          echo ""
          echo "========================================"
          echo "All SRS verified successfully"
          echo "========================================"


      - name: Commit generated files
        run: |

          git config user.name "github-actions[bot]"

          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"


          git add -A


          if git diff --cached --quiet; then

            echo "No changes to commit."

          else

            git commit -m "build: update rule sets"

            git push

          fi
