name: Build SRS Rule Sets

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

concurrency:
  group: build-srs-main
  cancel-in-progress: false


jobs:

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:

      - name: Checkout
        uses: actions/checkout@v5


      - name: Run unit tests
        run: |
          python3 tests/test_build_srs.py



  build:

    needs: test

    runs-on: ubuntu-latest
    timeout-minutes: 60


    steps:


      - name: Checkout
        uses: actions/checkout@v5



      - name: Install sing-box stable
        run: |
          curl -fsSL https://sing-box.app/install.sh | sudo sh
          sing-box version



      - name: Install jq
        run: |
          sudo apt-get update
          sudo apt-get install -y jq



      - name: Build SRS
        run: |
          python3 .github/scripts/build_srs.py



      - name: Verify SRS equals JSON
        run: |
          set -euo pipefail


          echo "========================================"
          echo "Verify JSON -> SRS -> JSON"
          echo "========================================"


          mkdir -p verify


          SRS_COUNT=$(find . -maxdepth 1 -type f -name "*.srs" | wc -l)


          if [ "${SRS_COUNT}" -eq 0 ]; then
              echo "ERROR: No SRS files found in project root"
              exit 1
          fi


          echo "Found ${SRS_COUNT} SRS files:"


          find . -maxdepth 1 -type f -name "*.srs" | sort


          echo ""
          echo "========================================"



          while IFS= read -r srs_file
          do


              name=$(basename "${srs_file}" .srs)

              json_file="${name}.json"



              echo ""
              echo "[CHECK] ${name}"



              if [ ! -f "${json_file}" ]; then

                  echo "ERROR: Missing JSON:"
                  echo "${json_file}"

                  exit 1

              fi



              echo "Decompile SRS..."

              sing-box rule-set decompile \
                --output "verify/${name}.json" \
                "${srs_file}"



              echo "Normalize JSON..."

              jq -S . \
                "${json_file}" \
                > "verify/${name}.source.sorted.json"



              jq -S . \
                "verify/${name}.json" \
                > "verify/${name}.srs.sorted.json"



              echo "Compare..."

              if diff -u \
                "verify/${name}.source.sorted.json" \
                "verify/${name}.srs.sorted.json"
              then

                  echo "✓ ${name}.srs OK"

              else

                  echo ""
                  echo "========================================"
                  echo "ERROR: ${name}.srs mismatch"
                  echo "========================================"


                  echo "Source JSON count:"
                  jq '.rules[0] | map_values(length)' \
                    "${json_file}" || true


                  echo ""
                  echo "Decoded SRS count:"
                  jq '.rules[0] | map_values(length)' \
                    "verify/${name}.json" || true


                  exit 1

              fi


          done < <(
              find . \
                -maxdepth 1 \
                -type f \
                -name "*.srs" \
                | sort
          )


          echo ""
          echo "========================================"
          echo "All SRS verified successfully"
          echo "========================================"


      - name: Commit generated files
        run: |

          git config user.name "github-actions[bot]"

          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"


          git add -A


          if git diff --cached --quiet; then

            echo "No changes to commit."

          else

            git commit -m "build: update rule sets"

            git push

          fi
